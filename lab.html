  <!-- 🔧 Critical early theme + icon setup -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const isLight = savedTheme === 'light';

      if (isLight) {
        document.documentElement.classList.add('light-mode');
      }

      // Pre-render icon HTML into a global var before page load
      window.__themeIcon = `<img id="themeIcon" src="images/${isLight ? 'lightmode.png' : 'darkmode.png'}" alt="Theme Icon" style="width: 1.5rem; height: 1.5rem;">`;
    })();
  </script>

  <!-- Preload icons to prevent delays -->
  <link rel="preload" as="image" href="images/lightmode.png">
  <link rel="preload" as="image" href="images/darkmode.png">
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
